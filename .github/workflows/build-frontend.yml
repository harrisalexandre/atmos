name: Build Atmos Frontend

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/build-frontend.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/build-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
