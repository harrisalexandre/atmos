name: Deploy REDEMET Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/redemet-poll/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-redemet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy redemet-poll
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: onwrpmobpnifqkrkkzdq

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify Supabase token is available
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not available to this workflow."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN is available."

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy redemet-poll --project-ref "$SUPABASE_PROJECT_ID" --use-api
